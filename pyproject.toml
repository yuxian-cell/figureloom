[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "origin: tests that require a real local Origin/OriginPro installation",
  "grapher: tests that require a real local Grapher installation",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]
