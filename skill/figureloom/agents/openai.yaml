interface:
  display_name: "FigureLoom"
  short_description: "检查科研数据并生成可编辑 Origin 或 Grapher 原生图"
  default_prompt: "请使用 $figureloom。先从用户请求确定 engine=origin、engine=grapher 或 engine=auto；明确指定 Origin/Grapher 时必须传入该后端，不能因 doctor、推荐或渲染失败而静默换后端。只有用户未指定时才传 engine=auto。‘在我已经打开的 Grapher 窗口里绘制’等于 engine=grapher，复用应用但不修改原有文档。先只读检查数据、推荐图形并确认科学语义，再用带明确 --engine 的 workflow-preview 冻结后端、生成原生可编辑项目并重开验证。若 Origin 仅因 Codex 沙箱上下文停止，才对同一精确命令申请受限本地执行；审批不保证通过。不要要求管理员权限或修改 DCOM/注册表。"
